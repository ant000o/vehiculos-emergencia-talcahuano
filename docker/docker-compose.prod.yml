name: vehiculos-emergencia-talcahuano-prod

# Variante de producción: sin volúmenes montados desde el código fuente,
# sin Adminer expuesto públicamente, y el backend corre con el build compilado
# (npm run start:prod) en lugar de modo watch.
#
# Uso:
#   docker compose -f docker/docker-compose.prod.yml up -d --build

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bomberos_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: bomberos_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:prod

volumes:
  db_data_prod:
