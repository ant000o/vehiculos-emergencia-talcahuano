name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend - lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # Instalación única en la raíz: npm workspaces resuelve todas las apps
      # (backend, web) desde un solo package-lock.json.
      - run: npm install
      # NOTA: "npx prisma generate" se reactiva aquí una vez que el equipo
      # defina el ERD (Fase 0) y schema.prisma tenga al menos un modelo.
      # Con el schema vacío, Prisma falla con "no models defined".
      - run: npm run lint --workspace=apps/backend --if-present
      - run: npm run build --workspace=apps/backend

  web:
    name: Web - lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run lint --workspace=apps/web --if-present
      - run: npm run build --workspace=apps/web
